name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore InternalRatingSystem/InternalRatingSystem.csproj

      - name: Build
        run: dotnet publish InternalRatingSystem/InternalRatingSystem.csproj -c Release -o ./publish

      - name: Package ZIP
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ZIP="Jellyfin.Plugin.InternalRating_${VERSION}.zip"

          # meta.json needs the FOUR-part version. .NET's Version treats an
          # omitted revision as -1, so "1.7.0" compares as LESS THAN the
          # "1.7.0.0" in manifest.json and a manual install is told an update
          # is available forever - which would undo the point of shipping
          # meta.json at all (#22).
          META_VERSION="$VERSION"
          while [ "$(echo "$META_VERSION" | tr -cd '.' | wc -c)" -lt 3 ]; do
            META_VERSION="${META_VERSION}.0"
          done

          # Ship meta.json INSIDE the zip.
          #
          # Issue #22: the archive used to contain nothing but the DLL. A
          # catalogue install is fine because Jellyfin writes meta.json from
          # manifest.json, but a MANUAL install leaves the plugin with no
          # metadata at all and Jellyfin then decides targetAbi for itself —
          # which is how a server on 10.11.5 ends up reporting "Not supported"
          # for a plugin whose manifest says 10.11.0.0.
          #
          # targetAbi MUST match manifest.json (10.11.0.0). StarTrack does not
          # use any 10.11.10-only API, so pinning it higher only locks out
          # servers that would have run it perfectly well.
          cat > publish/meta.json <<META
          {
            "category": "General",
            "guid": "a8b5e2f3-4c1d-4e8a-b2f9-6d3c7e1a5b2f",
            "name": "StarTrack",
            "description": "Community star ratings for movies and TV shows - stored privately on your Jellyfin server.",
            "owner": "ZL154",
            "overview": "Letterboxd-style ratings, reviews, watchlist, diary and lists for Jellyfin.",
            "targetAbi": "10.11.0.0",
            "version": "${META_VERSION}",
            "status": "Active",
            "autoUpdate": false,
            "imagePath": "",
            "assemblies": []
          }
          META

          zip -j "$ZIP" publish/Jellyfin.Plugin.InternalRating.dll publish/meta.json
          echo "ZIP=$ZIP" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Verify the packaged targetAbi matches manifest.json
        run: |
          # A drift here is invisible until a user on an older 10.11.x reports
          # "Not supported", so fail the build instead of shipping it.
          ZIP_ABI=$(grep -o '"targetAbi": *"[^"]*"' publish/meta.json | head -1 | sed 's/.*"\([0-9.]*\)"$/\1/')
          MAN_ABI=$(grep -o '"targetAbi": *"[^"]*"' manifest.json | head -1 | sed 's/.*"\([0-9.]*\)"$/\1/')
          echo "zip=$ZIP_ABI manifest=$MAN_ABI"
          if [ "$ZIP_ABI" != "$MAN_ABI" ]; then
            echo "::error::targetAbi mismatch: zip=$ZIP_ABI manifest=$MAN_ABI"
            exit 1
          fi

          # Same reasoning for the version itself: a 3-part meta.json version
          # reads as older than the 4-part manifest entry.
          ZIP_VER=$(grep -o '"version": *"[^"]*"' publish/meta.json | head -1 | sed 's/.*"\([0-9.]*\)"$//')
          if [ "$(echo "$ZIP_VER" | tr -cd '.' | wc -c)" -ne 3 ]; then
            echo "::error::meta.json version must have four parts, got $ZIP_VER"
            exit 1
          fi

      - name: Compute MD5 checksum
        id: checksum
        run: |
          MD5=$(md5sum "$ZIP" | awk '{print $1}')
          echo "md5=$MD5" >> $GITHUB_OUTPUT
          echo "Checksum: $MD5"

      - name: Show checksum (update manifest.json manually before tagging)
        run: echo "MD5 checksum for manifest.json -> ${{ steps.checksum.outputs.md5 }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP }}
          generate_release_notes: true
          body: |
            ## StarTrack ${{ env.VERSION }}

            ### Install via Jellyfin Plugin Repository
            Add this URL in **Dashboard → Plugins → Repositories**:
            ```
            https://raw.githubusercontent.com/ZL154/jellyfin-plugin-startrack/main/manifest.json
            ```

            ### Manual Install
            Download the ZIP below and extract the DLL into your Jellyfin plugins directory.
